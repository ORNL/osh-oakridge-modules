BasicSessionConfig.module.name=Βασικός έλεγχος ταυτότητας συνεδρίας
BasicSessionConfig.module.description=Ελέγχει την ταυτότητα αιτημάτων περιηγητή και API μέσω αδιαφανούς cookie συνεδρίας στον διακομιστή
