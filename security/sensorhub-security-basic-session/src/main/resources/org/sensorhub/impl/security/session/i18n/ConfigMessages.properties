BasicSessionConfig.module.name=Session Basic Authentication
BasicSessionConfig.module.description=Authenticates browser and API requests using an opaque server-side session cookie
BasicSessionConfig.cookieName.label=Session cookie name
BasicSessionConfig.cookieName.description=Name of the opaque authentication cookie.
BasicSessionConfig.idleTimeoutSeconds.label=Idle timeout (seconds)
BasicSessionConfig.idleTimeoutSeconds.description=Invalidate a session after this many seconds without a request.
BasicSessionConfig.absoluteTimeoutSeconds.label=Absolute timeout (seconds)
BasicSessionConfig.absoluteTimeoutSeconds.description=Maximum session lifetime, even while active.
BasicSessionConfig.secureCookie.label=Secure cookie
BasicSessionConfig.secureCookie.description=Only send the session cookie over HTTPS. Keep enabled in production.
BasicSessionConfig.sameSite.label=SameSite policy
BasicSessionConfig.sameSite.description=Use Strict for the local node. None permits credentialed cross-site access to an external node and requires HTTPS.
BasicSessionConfig.defaultRedirectPath.label=Default redirect path
BasicSessionConfig.defaultRedirectPath.description=Local path used after login when there is no saved destination.
