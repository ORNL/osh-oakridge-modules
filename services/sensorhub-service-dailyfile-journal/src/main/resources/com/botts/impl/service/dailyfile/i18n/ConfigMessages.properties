DailyFileJournalServiceConfig.module.name=Durable OSCAR Daily File Journal Service
DailyFileJournalServiceConfig.module.description=Crash-recoverable direct journal and atomic legacy daily-file publisher
DailyFileJournalServiceConfig.rootDirectory.label=Storage Root
DailyFileJournalServiceConfig.rootDirectory.description=Root containing the private journal and the public dailyfiles directory
DailyFileJournalServiceConfig.journalDirectory.label=Journal Directory
DailyFileJournalServiceConfig.journalDirectory.description=Private directory below Storage Root containing framed segments and ledgers
DailyFileJournalServiceConfig.publicationDirectory.label=Publication Directory
DailyFileJournalServiceConfig.publicationDirectory.description=Directory below Storage Root receiving legacy CSVs and manifests
DailyFileJournalServiceConfig.zoneId.label=Daily File Time Zone
DailyFileJournalServiceConfig.zoneId.description=IANA ZoneId used for daily rollover and local timestamps
DailyFileJournalServiceConfig.dailyFileObservationMode.label=Daily File Observation Mode
DailyFileJournalServiceConfig.dailyFileObservationMode.description=FULL and LATEST publish live compatibility observations and clean only completed manifest-validated days; NONE disables them
DailyFileJournalServiceConfig.fsyncIntervalMillis.label=Fsync Interval (milliseconds)
DailyFileJournalServiceConfig.fsyncIntervalMillis.description=Maximum wall-clock interval between periodic journal forces
DailyFileJournalServiceConfig.maxUnforcedRecords.label=Max Unforced Records
DailyFileJournalServiceConfig.maxUnforcedRecords.description=Force a segment after this many accepted records even if the timer has not fired
DailyFileJournalServiceConfig.maxUnforcedBytes.label=Max Unforced Bytes
DailyFileJournalServiceConfig.maxUnforcedBytes.description=Force a segment after this many accepted bytes even if the timer has not fired
DailyFileJournalServiceConfig.maxSegmentBytes.label=Max Segment Bytes
DailyFileJournalServiceConfig.maxSegmentBytes.description=Rotate a lane segment after it reaches this size
DailyFileJournalServiceConfig.maxSegmentAgeSeconds.label=Max Segment Age (seconds)
DailyFileJournalServiceConfig.maxSegmentAgeSeconds.description=Rotate an active lane segment after this age
DailyFileJournalServiceConfig.maxRecordBytes.label=Max Record Bytes
DailyFileJournalServiceConfig.maxRecordBytes.description=Reject a single RPM payload larger than this UTF-8 byte count
DailyFileJournalServiceConfig.sealedJournalRetentionDays.label=Sealed Journal Retention (days)
DailyFileJournalServiceConfig.sealedJournalRetentionDays.description=Days to retain sealed journal segments after the later of day close or immutable publication; zero retains segments indefinitely
DailyFileJournalServiceConfig.requireBackupBeforeSealedJournalDeletion.label=Require Backup Before Sealed Journal Deletion
DailyFileJournalServiceConfig.requireBackupBeforeSealedJournalDeletion.description=Require a matching verified external-backup confirmation before deleting an expired sealed journal day. When disabled, deletion still requires a valid immutable CSV, manifest, ledger, and an exact replay match to the sealed journal.
