DailyFileJournalServiceConfig.module.name=Service de journal durable des fichiers quotidiens OSCAR
DailyFileJournalServiceConfig.module.description=Journal direct récupérable après incident et publication atomique des fichiers quotidiens compatibles
DailyFileJournalServiceConfig.rootDirectory.label=Racine de stockage
DailyFileJournalServiceConfig.rootDirectory.description=Répertoire racine contenant le journal privé et le dossier public dailyfiles
DailyFileJournalServiceConfig.journalDirectory.label=Répertoire du journal
DailyFileJournalServiceConfig.journalDirectory.description=Répertoire privé sous la racine contenant les segments tramés et les registres
DailyFileJournalServiceConfig.publicationDirectory.label=Répertoire de publication
DailyFileJournalServiceConfig.publicationDirectory.description=Répertoire sous la racine recevant les CSV et manifestes publiés
DailyFileJournalServiceConfig.zoneId.label=Fuseau horaire quotidien
DailyFileJournalServiceConfig.zoneId.description=Identifiant IANA utilisé pour la rotation quotidienne et les horodatages locaux
DailyFileJournalServiceConfig.dailyFileObservationMode.label=Mode d'observation quotidienne
DailyFileJournalServiceConfig.dailyFileObservationMode.description=FULL et LATEST publient des observations compatibles en direct et ne purgent que les journées complètes validées par manifeste ; NONE les désactive
DailyFileJournalServiceConfig.fsyncIntervalMillis.label=Intervalle fsync (ms)
DailyFileJournalServiceConfig.fsyncIntervalMillis.description=Intervalle maximal entre les synchronisations disque périodiques du journal
DailyFileJournalServiceConfig.maxUnforcedRecords.label=Enregistrements non forcés max.
DailyFileJournalServiceConfig.maxUnforcedRecords.description=Synchronise le segment après ce nombre d'enregistrements acceptés même avant l'échéance du minuteur
DailyFileJournalServiceConfig.maxUnforcedBytes.label=Octets non forcés max.
DailyFileJournalServiceConfig.maxUnforcedBytes.description=Synchronise le segment après ce nombre d'octets acceptés même avant l'échéance du minuteur
DailyFileJournalServiceConfig.maxSegmentBytes.label=Taille max. de segment (octets)
DailyFileJournalServiceConfig.maxSegmentBytes.description=Fait tourner un segment de voie lorsqu'il atteint cette taille
DailyFileJournalServiceConfig.maxSegmentAgeSeconds.label=Âge max. de segment (s)
DailyFileJournalServiceConfig.maxSegmentAgeSeconds.description=Fait tourner un segment de voie actif après cette durée
DailyFileJournalServiceConfig.maxRecordBytes.label=Taille max. d'enregistrement (octets)
DailyFileJournalServiceConfig.maxRecordBytes.description=Rejette une charge utile RPM unique dépassant ce nombre d'octets UTF-8
DailyFileJournalServiceConfig.sealedJournalRetentionDays.label=Rétention du journal scellé (jours)
DailyFileJournalServiceConfig.sealedJournalRetentionDays.description=Jours de conservation des segments scellés après la clôture du jour ou la publication immuable ; zéro conserve indéfiniment
DailyFileJournalServiceConfig.requireBackupBeforeSealedJournalDeletion.label=Exiger une sauvegarde avant purge
DailyFileJournalServiceConfig.requireBackupBeforeSealedJournalDeletion.description=Exige une confirmation vérifiée de sauvegarde externe avant de supprimer un jour scellé expiré. Même désactivé, exige un CSV immuable, un manifeste, un registre et une relecture identique.
