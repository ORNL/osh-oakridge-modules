DailyFileJournalServiceConfig.module.name=Servicio de registro duradero de archivos diarios OSCAR
DailyFileJournalServiceConfig.module.description=Registro directo recuperable ante fallos y publicador atómico de archivos diarios compatibles
DailyFileJournalServiceConfig.rootDirectory.label=Raíz de almacenamiento
DailyFileJournalServiceConfig.rootDirectory.description=Directorio raíz que contiene el registro privado y el directorio público dailyfiles
DailyFileJournalServiceConfig.journalDirectory.label=Directorio de registro
DailyFileJournalServiceConfig.journalDirectory.description=Directorio privado bajo la raíz con segmentos tramados y libros contables
DailyFileJournalServiceConfig.publicationDirectory.label=Directorio de publicación
DailyFileJournalServiceConfig.publicationDirectory.description=Directorio bajo la raíz que recibe los archivos CSV y manifiestos publicados
DailyFileJournalServiceConfig.zoneId.label=Zona horaria diaria
DailyFileJournalServiceConfig.zoneId.description=Identificador IANA utilizado para el corte diario y las marcas horarias locales
DailyFileJournalServiceConfig.dailyFileObservationMode.label=Modo de observación diaria
DailyFileJournalServiceConfig.dailyFileObservationMode.description=FULL y LATEST publican observaciones compatibles en vivo y limpian solo días completos validados con manifiesto; NONE las desactiva
DailyFileJournalServiceConfig.fsyncIntervalMillis.label=Intervalo fsync (ms)
DailyFileJournalServiceConfig.fsyncIntervalMillis.description=Intervalo máximo de reloj entre sincronizaciones periódicas del registro en disco
DailyFileJournalServiceConfig.maxUnforcedRecords.label=Máx. registros sin sincronizar
DailyFileJournalServiceConfig.maxUnforcedRecords.description=Sincroniza el segmento tras este número de registros aceptados aunque no haya vencido el temporizador
DailyFileJournalServiceConfig.maxUnforcedBytes.label=Máx. bytes sin sincronizar
DailyFileJournalServiceConfig.maxUnforcedBytes.description=Sincroniza el segmento tras este número de bytes aceptados aunque no haya vencido el temporizador
DailyFileJournalServiceConfig.maxSegmentBytes.label=Tamaño máx. de segmento (bytes)
DailyFileJournalServiceConfig.maxSegmentBytes.description=Rota un segmento de carril al alcanzar este tamaño
DailyFileJournalServiceConfig.maxSegmentAgeSeconds.label=Edad máx. de segmento (s)
DailyFileJournalServiceConfig.maxSegmentAgeSeconds.description=Rota un segmento de carril activo al alcanzar esta antigüedad
DailyFileJournalServiceConfig.maxRecordBytes.label=Tamaño máx. de registro (bytes)
DailyFileJournalServiceConfig.maxRecordBytes.description=Rechaza una carga útil individual de RPM mayor que este tamaño en bytes UTF-8
DailyFileJournalServiceConfig.sealedJournalRetentionDays.label=Retención de registro sellado (días)
DailyFileJournalServiceConfig.sealedJournalRetentionDays.description=Días que se conservan los segmentos sellados tras el cierre del día o su publicación inmutable; cero los conserva indefinidamente
DailyFileJournalServiceConfig.requireBackupBeforeSealedJournalDeletion.label=Exigir copia antes de borrar registro sellado
DailyFileJournalServiceConfig.requireBackupBeforeSealedJournalDeletion.description=Exige confirmación verificada de copia externa antes de borrar un día sellado vencido. Incluso desactivado, exige CSV inmutable, manifiesto, libro contable y coincidencia exacta de reproducción.
