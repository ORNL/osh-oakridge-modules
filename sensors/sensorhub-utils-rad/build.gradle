description = 'RAD Utilities'
ext.details = "Utilities for creation drivers for Radiological Sensors and Systems"
version = '1.2.0'

def thisProjectDir = projectDir
rootProject.allprojects {
    repositories {
        mavenCentral()
        maven { url "file:///$thisProjectDir/libs"}
        google()
    }
}

configurations {
    xjcTool
}

dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    implementation project(':sensorhub-service-bucket') // daily file appender writes into the bucket store

    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:3.0.1'
    implementation 'com.fasterxml.woodstox:woodstox-core:6.2.6'
    implementation 'org.glassfish.jaxb:jaxb-runtime:3.0.2'

    testImplementation('junit:junit:4.13')
    testImplementation('org.mockito:mockito-core:3.12.4')

    // Explicitly set the classpath for the xjc tool (replaces unmaintained Gradle 6 xjc plugin).
    xjcTool 'com.sun.xml.bind:jaxb-xjc:3.0.2'
    xjcTool 'org.glassfish.jaxb:jaxb-runtime:3.0.2'
    xjcTool 'jakarta.xml.bind:jakarta.xml.bind-api:3.0.1'
}

def xjcOutputDir = layout.buildDirectory.dir('generated/sources/xjc/java/main')

def xjcGenerate = tasks.register('xjcGenerate', JavaExec) {
    group = 'build'
    description = 'Generates JAXB N42 Java classes from src/main/schema/*.xsd'
    classpath = configurations.xjcTool
    mainClass = 'com.sun.tools.xjc.XJCFacade'
    inputs.dir(file('src/main/schema'))
    outputs.dir(xjcOutputDir)
    doFirst {
        def outDir = xjcOutputDir.get().asFile
        outDir.mkdirs()
        def schemas = fileTree('src/main/schema') { include '*.xsd' }.files.sort().collect { it.absolutePath }
        args = ['-no-header', '-enableIntrospection', '-p', 'com.botts.impl.utils.n42', '-d', outDir.absolutePath] + schemas
    }
}

sourceSets {
    main {
        java {
            srcDir(xjcGenerate)
        }
    }
}



