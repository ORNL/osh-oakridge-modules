RapiscanRPMConfig.EMLConfig.emlEnabled.description=Seleccione esta opción para un carril VM250; déjela desactivada para los carriles que no estén designados como EML
RapiscanRPMConfig.EMLConfig.isCollimated.label=Está colimado
RapiscanRPMConfig.EMLConfig.isCollimated.description=Estado de colimación
RapiscanRPMConfig.EMLConfig.laneWidth.label=Ancho del carril (m)
RapiscanRPMConfig.EMLConfig.laneWidth.description=Ancho del carril en metros
RS350RPMConfig.type.name=RS350
SonyCameraConfig.type.name=Sony
AxisCameraConfig.type.name=Axis
AxisCameraConfig.streamPath.label=Códec de transmisión
AxisCameraConfig.streamPath.description=Genera la URL de transmisión con el códec seleccionado
CustomCameraConfig.type.name=Personalizada
CustomCameraConfig.streamPath.label=Ruta de transmisión
CustomCameraConfig.streamPath.description=Ruta de la transmisión de vídeo; solo se aplica al tipo de cámara Personalizada
OcrConfig.enabled.label=Activar OCR de vehículos
OcrConfig.enabled.description=Interruptor principal; cuando está activado, las grabaciones de cámara se analizan de forma asíncrona en segundo plano según lo permitan los recursos
OcrConfig.alarmsOnly.label=Solo alarmas
OcrConfig.alarmsOnly.description=Analizar únicamente ocupaciones con alarma gamma o de neutrones (predeterminado); desactívelo para analizar todas las ocupaciones grabadas
OcrConfig.modelDir.label=Directorio de modelos
OcrConfig.modelDir.description=Directorio que contiene det.onnx, rec.onnx y dict.txt, relativo al directorio del nodo o absoluto
OcrConfig.readContainerIds.label=Leer números de contenedor
OcrConfig.readContainerIds.description=Reconocer y validar números de contenedores marítimos ISO 6346
OcrConfig.readPlates.label=Leer matrículas
OcrConfig.readPlates.description=Reconocer números de matrícula de vehículos
OcrConfig.cameraUids.label=UID de cámaras
OcrConfig.cameraUids.description=Lista opcional de UID de cámaras que se analizarán; déjela vacía para usar todas las cámaras del carril
OcrConfig.framesPerVideo.label=Fotogramas por clip
OcrConfig.framesPerVideo.description=Número máximo de fotogramas muestreados por clip grabado (1-12)
OcrConfig.containerMinConfidence.label=Confianza mínima de contenedor
OcrConfig.containerMinConfidence.description=Las lecturas de contenedor inferiores a esta confianza (0.0-1.0) se descartan salvo que valide su dígito de control ISO 6346
OcrConfig.plateMinConfidence.label=Confianza mínima de matrícula
OcrConfig.plateMinConfidence.description=Las lecturas de matrícula inferiores a esta confianza (0.0-1.0) se descartan
OcrConfig.ignoreTopFraction.label=Fracción superior ignorada
OcrConfig.ignoreTopFraction.description=Fracción de altura del fotograma (0.0-0.45) en el borde superior que se ignora para excluir marcas de tiempo sobreimpresas
OcrConfig.ignoreBottomFraction.label=Fracción inferior ignorada
OcrConfig.ignoreBottomFraction.description=Fracción de altura del fotograma (0.0-0.45) en el borde inferior que se ignora para excluir leyendas sobreimpresas
LaneConfig.webRelayConfig.label=Luces y sirena WebRelay
LaneConfig.webRelayConfig.description=Control opcional de luces y sirena físicas del RPM mediante módulos ControlByWeb WebRelay-Quad
WebRelayConfig.enabled.label=Activar luces y sirena WebRelay
WebRelayConfig.enabled.description=Interruptor principal; cuando está activado, OSCAR se conecta al módulo ControlByWeb WebRelay-Quad del carril para gestionar luces y sirena del RPM
WebRelayConfig.mode.label=Modo de operación
WebRelayConfig.mode.description=AUTO intercepta señales directas y pulsa luces/sirena solo ante alarmas accionables; PASS_THROUGH mantiene los relés nativos del RPM; MUTED silencia alarmas automáticas
WebRelayConfig.primaryHost.label=Host del WebRelay primario
WebRelayConfig.primaryHost.description=Dirección IPv4 o nombre de host del WebRelay-Quad primario que controla las luces y la sirena del pilar RPM
WebRelayConfig.primaryPort.label=Puerto del WebRelay primario
WebRelayConfig.primaryPort.description=Puerto HTTP del WebRelay-Quad primario (predeterminado: 80)
WebRelayConfig.ancillaryEnabled.label=Activar WebRelay auxiliar
WebRelayConfig.ancillaryEnabled.description=Actívelo cuando exista un segundo WebRelay-Quad en el carril para paneles externos de contacto seco o barreras
WebRelayConfig.ancillaryHost.label=Host del WebRelay auxiliar
WebRelayConfig.ancillaryHost.description=Dirección IPv4 o nombre de host del WebRelay-Quad auxiliar opcional
WebRelayConfig.ancillaryPort.label=Puerto del WebRelay auxiliar
WebRelayConfig.ancillaryPort.description=Puerto HTTP del WebRelay-Quad auxiliar opcional (predeterminado: 80)
WebRelayConfig.username.label=Usuario HTTP de control
WebRelayConfig.username.description=Nombre de usuario HTTP Basic opcional si la contraseña de control está habilitada en el WebRelay
WebRelayConfig.password.label=Contraseña HTTP de control
WebRelayConfig.password.description=Contraseña HTTP Basic opcional para solicitudes de estado del WebRelay (déjela vacía si no usa contraseña de control)
WebRelayConfig.alarmPulseSeconds.label=Duración del pulso de alarma (s)
WebRelayConfig.alarmPulseSeconds.description=Duración en segundos (1-300) del pulso temporizado por hardware en los relés 3 y 4 ante alarmas accionables (predeterminado: 5 s)
WebRelayConfig.suppressExtendedOccupancyGamma.label=Suprimir en Código 9998 (Ocupación prolongada gamma)
WebRelayConfig.suppressExtendedOccupancyGamma.description=Cuando está activado (predeterminado), las alarmas solo gamma por ocupación prolongada (Código 9998) no activan luces ni sirena físicas
WebRelayConfig.soundOnNeutronAlarm.label=Sonar sirena en alarma solo de neutrones
WebRelayConfig.soundOnNeutronAlarm.description=Cuando está activado, las alarmas solo de neutrones pulsan el Canal 2 (luz azul) y el Canal 1 (luz roja y sirena); desactívelo para pulsar solo el Canal 2
WebRelayConfig.pollIntervalSeconds.label=Intervalo de sondeo de estado (s)
WebRelayConfig.pollIntervalSeconds.description=Intervalo en segundos (2-300) para consultar el estado XML del WebRelay y rearmar relés tras cortes eléctricos (predeterminado: 10 s)
WebRelayOperatingMode.value.AUTO=Automático (gestionado por OSCAR / EML)
WebRelayOperatingMode.value.PASS_THROUGH=Paso directo por hardware (nativo del RPM)
WebRelayOperatingMode.value.MUTED=Silenciado (suprimir alarmas automáticas)
