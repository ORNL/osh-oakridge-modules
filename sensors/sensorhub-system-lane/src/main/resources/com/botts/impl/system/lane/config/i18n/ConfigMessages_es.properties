LaneConfig.module.name=Sistema de carril
LaneConfig.module.description=Módulo especializado de sistema de sensores utilizado como sistema principal para los controladores RPM y de vídeo de un carril
LaneConfig.operationalViewKeys.label=Claves de vista operativa
LaneConfig.operationalViewKeys.description=Claves de vista de estación de trabajo que pueden mostrar este carril; use letras minúsculas, números y guiones
LaneConfig.extendedOccupancyThresholdMinutes.label=Umbral de ocupación prolongada (min)
LaneConfig.extendedOccupancyThresholdMinutes.description=Duración en minutos (1-1440) antes de que una ocupación activa se registre como un fallo de ocupación prolongada (predeterminado: 1 minuto)
LaneConfig.laneOptionsConfig.label=Opciones del carril
LaneConfig.laneOptionsConfig.description=Opciones adicionales al crear un carril RPM
LaneConfig.ocrConfig.label=OCR de vehículos
LaneConfig.ocrConfig.description=OCR asíncrono opcional de números de contenedor y matrículas a partir de grabaciones de cámaras del carril
LaneConfig.autoDelete.label=Eliminar datos al quitar el carril
LaneConfig.autoDelete.description=Elimina automáticamente todos los registros de este carril cuando se quita
LaneOptionsConfig.rpmConfig.label=Configuración inicial del RPM
LaneOptionsConfig.rpmConfig.description=Configuración utilizada para la preparación inicial del RPM
LaneOptionsConfig.ffmpegConfig.label=Configuración inicial de la cámara
LaneOptionsConfig.ffmpegConfig.description=Configuración utilizada para la preparación inicial de la cámara FFmpeg
