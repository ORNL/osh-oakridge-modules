RapiscanRPMConfig.EMLConfig.emlEnabled.description=Sélectionnez cette option pour une voie VM250 ; laissez-la désactivée pour les voies qui ne sont pas désignées comme EML
RapiscanRPMConfig.EMLConfig.isCollimated.label=Est collimaté
RapiscanRPMConfig.EMLConfig.isCollimated.description=État de collimation
RapiscanRPMConfig.EMLConfig.laneWidth.label=Largeur de la voie (m)
RapiscanRPMConfig.EMLConfig.laneWidth.description=Largeur de la voie en mètres
