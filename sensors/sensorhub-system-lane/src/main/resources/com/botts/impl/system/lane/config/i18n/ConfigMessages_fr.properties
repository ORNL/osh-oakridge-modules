LaneConfig.module.name=Système de voie
LaneConfig.module.description=Module spécialisé de système de capteurs utilisé comme système parent pour les pilotes RPM et vidéo d'une voie
LaneConfig.operationalViewKeys.label=Clés de vue opérationnelle
LaneConfig.operationalViewKeys.description=Clés de vue de poste autorisées à afficher cette voie; utilisez des lettres minuscules, des chiffres et des tirets
LaneConfig.extendedOccupancyThresholdMinutes.label=Seuil d'occupation prolongée (min)
LaneConfig.extendedOccupancyThresholdMinutes.description=Durée en minutes (1-1440) avant qu'une occupation active ne soit enregistrée comme un défaut d'occupation prolongée (par défaut : 1 minute)
LaneConfig.laneOptionsConfig.label=Options de la voie
LaneConfig.laneOptionsConfig.description=Options supplémentaires lors de la création d'une voie RPM
LaneConfig.ocrConfig.label=OCR des véhicules
LaneConfig.ocrConfig.description=OCR asynchrone optionnel des numéros de conteneur et des plaques d'immatriculation à partir des enregistrements vidéo de la voie
LaneConfig.autoDelete.label=Supprimer les données avec la voie
LaneConfig.autoDelete.description=Supprime automatiquement tous les enregistrements de cette voie lorsqu'elle est retirée
LaneOptionsConfig.rpmConfig.label=Configuration RPM initiale
LaneOptionsConfig.rpmConfig.description=Configuration utilisée pour la mise en service initiale du RPM
LaneOptionsConfig.ffmpegConfig.label=Configuration initiale de la caméra
LaneOptionsConfig.ffmpegConfig.description=Configuration utilisée pour la mise en service initiale de la caméra FFmpeg
