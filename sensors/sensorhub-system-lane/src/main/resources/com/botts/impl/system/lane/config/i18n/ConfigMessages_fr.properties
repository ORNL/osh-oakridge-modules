AxisCameraConfig.streamPath.label=Codec du flux
AxisCameraConfig.streamPath.description=Génère l'URL de diffusion avec le codec sélectionné
CustomCameraConfig.type.name=Personnalisée
CustomCameraConfig.streamPath.label=Chemin du flux
CustomCameraConfig.streamPath.description=Chemin du flux vidéo ; s'applique uniquement au type de caméra Personnalisée
OcrConfig.enabled.label=Activer l'OCR des véhicules
OcrConfig.enabled.description=Interrupteur principal ; lorsqu'il est activé, les enregistrements caméra sont analysés de façon asynchrone selon les ressources disponibles
OcrConfig.alarmsOnly.label=Alarmes uniquement
OcrConfig.alarmsOnly.description=Analyser uniquement les occupations avec alarme gamma ou neutron (par défaut) ; désactivez pour analyser toutes les occupations enregistrées
OcrConfig.modelDir.label=Répertoire des modèles
OcrConfig.modelDir.description=Répertoire contenant det.onnx, rec.onnx et dict.txt, relatif au répertoire du nœud ou absolu
OcrConfig.readContainerIds.label=Lire les numéros de conteneur
OcrConfig.readContainerIds.description=Reconnaître et valider les numéros de conteneurs maritimes ISO 6346
OcrConfig.readPlates.label=Lire les plaques d'immatriculation
OcrConfig.readPlates.description=Reconnaître les numéros de plaques d'immatriculation
OcrConfig.cameraUids.label=UID des caméras
OcrConfig.cameraUids.description=Liste facultative d'UID de caméras à analyser ; laissez vide pour utiliser toutes les caméras de la voie
OcrConfig.framesPerVideo.label=Images par séquence
OcrConfig.framesPerVideo.description=Nombre maximal d'images échantillonnées par séquence vidéo enregistrée (1-12)
OcrConfig.containerMinConfidence.label=Confiance minimale conteneur
OcrConfig.containerMinConfidence.description=Les lectures de conteneur sous ce seuil (0.0-1.0) sont ignorées sauf si le chiffre de contrôle ISO 6346 est valide
OcrConfig.plateMinConfidence.label=Confiance minimale plaque
OcrConfig.plateMinConfidence.description=Les lectures de plaque sous ce seuil (0.0-1.0) sont ignorées
OcrConfig.ignoreTopFraction.label=Fraction supérieure ignorée
OcrConfig.ignoreTopFraction.description=Fraction de la hauteur d'image (0.0-0.45) ignorée en haut pour exclure l'horodatage incrusté
OcrConfig.ignoreBottomFraction.label=Fraction inférieure ignorée
OcrConfig.ignoreBottomFraction.description=Fraction de la hauteur d'image (0.0-0.45) ignorée en bas pour exclure les légendes incrustées
LaneConfig.webRelayConfig.label=Voyants et sirène WebRelay
LaneConfig.webRelayConfig.description=Contrôle facultatif des voyants et de la sirène physiques du portique RPM via des modules ControlByWeb WebRelay-Quad
WebRelayConfig.enabled.label=Activer les voyants et la sirène WebRelay
WebRelayConfig.enabled.description=Interrupteur principal ; lorsqu'il est activé, OSCAR se connecte au module ControlByWeb WebRelay-Quad de la voie pour piloter les voyants et la sirène du RPM
WebRelayConfig.mode.label=Mode de fonctionnement
WebRelayConfig.mode.description=AUTO intercepte les signaux bruts et déclenche voyants/sirène uniquement sur alarme confirmée ; PASS_THROUGH laisse agir les relais natifs du RPM ; MUTED coupe les alarmes automatiques
WebRelayConfig.primaryHost.label=Hôte du WebRelay principal
WebRelayConfig.primaryHost.description=Adresse IPv4 ou nom d'hôte du WebRelay-Quad principal pilotant les voyants et la sirène du portique RPM
WebRelayConfig.primaryPort.label=Port du WebRelay principal
WebRelayConfig.primaryPort.description=Port HTTP du WebRelay-Quad principal (par défaut : 80)
WebRelayConfig.ancillaryEnabled.label=Activer le WebRelay auxiliaire
WebRelayConfig.ancillaryEnabled.description=Activez lorsqu'un second WebRelay-Quad est installé sur la voie pour des panneaux d'alarme à contact sec ou des barrières
WebRelayConfig.ancillaryHost.label=Hôte du WebRelay auxiliaire
WebRelayConfig.ancillaryHost.description=Adresse IPv4 ou nom d'hôte du WebRelay-Quad auxiliaire facultatif
WebRelayConfig.ancillaryPort.label=Port du WebRelay auxiliaire
WebRelayConfig.ancillaryPort.description=Port HTTP du WebRelay-Quad auxiliaire facultatif (par défaut : 80)
WebRelayConfig.username.label=Identifiant HTTP de contrôle
WebRelayConfig.username.description=Identifiant HTTP Basic facultatif lorsque la protection par mot de passe de contrôle est activée sur le WebRelay
WebRelayConfig.password.label=Mot de passe HTTP de contrôle
WebRelayConfig.password.description=Mot de passe HTTP Basic facultatif pour les requêtes d'état du WebRelay (laissez vide si désactivé sur le module)
WebRelayConfig.alarmPulseSeconds.label=Durée d'impulsion d'alarme (s)
WebRelayConfig.alarmPulseSeconds.description=Durée en secondes (1-300) de l'impulsion temporisée matériellement sur les relais 3 et 4 lors d'alarmes confirmées (par défaut : 5 s)
WebRelayConfig.suppressExtendedOccupancyGamma.label=Supprimer sur Code 9998 (Occupation prolongée gamma)
WebRelayConfig.suppressExtendedOccupancyGamma.description=Lorsqu'activé (par défaut), les alarmes gamma seules en occupation prolongée (Code 9998) ne déclenchent ni voyants ni sirène physiques
WebRelayConfig.soundOnNeutronAlarm.label=Activer la sirène sur alarme neutron seule
WebRelayConfig.soundOnNeutronAlarm.description=Lorsqu'activé, une alarme neutron seule déclenche le Canal 2 (voyant bleu) et le Canal 1 (voyant rouge et sirène) ; désactivez pour le Canal 2 uniquement
WebRelayConfig.pollIntervalSeconds.label=Intervalle de supervision (s)
WebRelayConfig.pollIntervalSeconds.description=Intervalle en secondes (2-300) de lecture de l'état XML du WebRelay et de réarmement après coupure électrique (par défaut : 10 s)
WebRelayOperatingMode.value.AUTO=Automatique (géré par OSCAR / EML)
WebRelayOperatingMode.value.PASS_THROUGH=Passage direct matériel (RPM natif)
WebRelayOperatingMode.value.MUTED=Muet (supprimer les alarmes automatiques)
