AxisCameraConfig.type.name=Axis
AxisCameraConfig.streamPath.label=Stream Codec
AxisCameraConfig.streamPath.description=Generate the streaming URL with the selected codec
CustomCameraConfig.type.name=Custom
CustomCameraConfig.streamPath.label=Stream Path
CustomCameraConfig.streamPath.description=Path for the video stream; applies only to the Custom camera type
OcrConfig.enabled.label=Enable Vehicle OCR
OcrConfig.enabled.description=Master switch; when enabled, camera recordings are asynchronously scanned in the background as system resources allow
OcrConfig.alarmsOnly.label=Alarms Only
OcrConfig.alarmsOnly.description=Scan only occupancies with a gamma or neutron alarm (default); disable to scan all recorded occupancies on this lane
OcrConfig.modelDir.label=Model Directory
OcrConfig.modelDir.description=Directory containing det.onnx, rec.onnx, and dict.txt relative to the node directory or absolute
OcrConfig.readContainerIds.label=Read Container Numbers
OcrConfig.readContainerIds.description=Recognize and validate ISO 6346 shipping container numbers
OcrConfig.readPlates.label=Read License Plates
OcrConfig.readPlates.description=Recognize license plate numbers
OcrConfig.cameraUids.label=Camera UIDs
OcrConfig.cameraUids.description=Optional allowlist of camera system UIDs to scan; leave empty to scan all cameras in this lane
OcrConfig.framesPerVideo.label=Frames Per Clip
OcrConfig.framesPerVideo.description=Maximum number of keyframes sampled per recorded camera clip (1-12)
OcrConfig.containerMinConfidence.label=Container Min Confidence
OcrConfig.containerMinConfidence.description=Container reads below this confidence (0.0-1.0) are dropped unless their ISO 6346 check digit validates
OcrConfig.plateMinConfidence.label=Plate Min Confidence
OcrConfig.plateMinConfidence.description=License plate reads below this confidence (0.0-1.0) are dropped
OcrConfig.ignoreTopFraction.label=Ignore Top Band Fraction
OcrConfig.ignoreTopFraction.description=Fraction of frame height (0.0-0.45) at the top edge to ignore so burned-in camera timestamps are excluded
OcrConfig.ignoreBottomFraction.label=Ignore Bottom Band Fraction
OcrConfig.ignoreBottomFraction.description=Fraction of frame height (0.0-0.45) at the bottom edge to ignore so burned-in camera captions are excluded
LaneConfig.webRelayConfig.label=WebRelay Lights & Sound
LaneConfig.webRelayConfig.description=Optional ControlByWeb WebRelay-Quad physical RPM pillar lights and sounder control
WebRelayConfig.enabled.label=Enable WebRelay Lights & Sound
WebRelayConfig.enabled.description=Master switch; when enabled, OSCAR connects to the lane's ControlByWeb WebRelay-Quad module(s) to manage physical RPM pillar lights and sounder
WebRelayConfig.mode.label=Operating Mode
WebRelayConfig.mode.description=AUTO intercepts raw hardware signals and pulses lights/sounder only on actionable alarms; PASS_THROUGH leaves native RPM hardware relays active; MUTED silences automatic alarms
WebRelayConfig.primaryHost.label=Primary WebRelay Host
WebRelayConfig.primaryHost.description=IPv4 address or hostname of the Primary WebRelay-Quad controlling RPM pillar lights and sounder
WebRelayConfig.primaryPort.label=Primary WebRelay Port
WebRelayConfig.primaryPort.description=HTTP port of the Primary WebRelay-Quad (default: 80)
WebRelayConfig.ancillaryEnabled.label=Enable Ancillary WebRelay
WebRelayConfig.ancillaryEnabled.description=Enable when a second WebRelay-Quad is installed on the lane for external dry-contact alarm panels or gate-arm interlocks
WebRelayConfig.ancillaryHost.label=Ancillary WebRelay Host
WebRelayConfig.ancillaryHost.description=IPv4 address or hostname of the optional Ancillary WebRelay-Quad
WebRelayConfig.ancillaryPort.label=Ancillary WebRelay Port
WebRelayConfig.ancillaryPort.description=HTTP port of the optional Ancillary WebRelay-Quad (default: 80)
WebRelayConfig.username.label=HTTP Control Username
WebRelayConfig.username.description=Optional HTTP Basic username when Control Password protection is enabled on the WebRelay (default: admin or blank)
WebRelayConfig.password.label=HTTP Control Password
WebRelayConfig.password.description=Optional HTTP Basic control password for WebRelay state requests (leave blank when Control Password is disabled on the module)
WebRelayConfig.alarmPulseSeconds.label=Alarm Pulse Duration (s)
WebRelayConfig.alarmPulseSeconds.description=Hardware-timed pulse duration in seconds (1-300) sent to Relay 3 / Relay 4 on actionable occupancy alarms (default: 5 seconds)
WebRelayConfig.suppressExtendedOccupancyGamma.label=Suppress on Code 9998 (Extended Occupancy Gamma)
WebRelayConfig.suppressExtendedOccupancyGamma.description=When enabled (default), gamma-only extended occupancy alarms auto-adjudicated as Code 9998 do not trigger physical RPM lights or sounder
WebRelayConfig.soundOnNeutronAlarm.label=Sound Siren on Neutron-Only Alarm
WebRelayConfig.soundOnNeutronAlarm.description=When enabled, neutron-only alarms pulse both Channel 2 (Neutron Blue Light) and Channel 1 (Gamma Red Light + Audible Sounder); disable to pulse Channel 2 only
WebRelayConfig.pollIntervalSeconds.label=Health Poll Interval (s)
WebRelayConfig.pollIntervalSeconds.description=Interval in seconds (2-300) for polling WebRelay XML state and reconciling armed coil state after power blips (default: 10 seconds)
WebRelayOperatingMode.value.AUTO=Automatic (OSCAR / EML Managed)
WebRelayOperatingMode.value.PASS_THROUGH=Hardware Pass-Through (RPM Native)
WebRelayOperatingMode.value.MUTED=Muted (Suppress Automatic Alarms)
