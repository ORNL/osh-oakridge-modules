RapiscanRPMConfig.EMLConfig.emlEnabled.label=Enable EML Analysis
RapiscanRPMConfig.EMLConfig.emlEnabled.description=Select this for a VM250 lane; leave it cleared for lanes that are not designated as EML lanes
RapiscanRPMConfig.EMLConfig.isCollimated.label=Is Collimated
RapiscanRPMConfig.EMLConfig.isCollimated.description=Collimation status
RapiscanRPMConfig.EMLConfig.laneWidth.label=Lane Width (m)
RapiscanRPMConfig.EMLConfig.laneWidth.description=Width of the lane in meters
