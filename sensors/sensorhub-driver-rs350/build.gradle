description = 'RS-350 Radiation Sensor Driver'
ext.details = 'Low-level driver for the RS-350 radiation detector data feed. To deploy a backpack unit, use the Mobile Detector System module instead.'
version = '1.0.0'

dependencies {
    implementation 'org.sensorhub:sensorhub-core:' + oshCoreVersion
    implementation project(':sensorhub-utils-rad')
    //implementation project(':sensorhub-service-oscar')
    implementation project(':sensorhub-service-bucket')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.25.0'

    implementation 'org.apache.commons:commons-lang3:3.22.0'
    implementation 'jakarta.xml.bind:jakarta.xml.bind-api:3.0.1'
    implementation 'com.fasterxml.woodstox:woodstox-core:7.3.0'
    implementation 'org.glassfish.jaxb:jaxb-runtime:3.0.2'
}

test {
    useJUnit()
}

osgi {
    manifest {
        attributes('Bundle-Vendor': 'Botts Innovative Research, Inc.')
        attributes('Bundle-Activator': 'com.botts.impl.sensor.rs350.RS350Activator')
    }
}

// add info to maven pom
ext.pom >>= {
    developers {
        developer {
            id 'drewbotts'
            name 'Drew Botts'
            organization 'Botts Innovative Research'
            organizationUrl 'http://www.botts-inc.com'
        }
        developer {
            id 'michael.elmore'
            name 'Michael Elmore'
            organization 'Botts Innovative Research'
            organizationUrl 'http://www.botts-inc.com'
        }
    }
}
